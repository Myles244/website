<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myles Harrison</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        /* Default Light Theme Variables */
        :root {
            --bg-color: #f4f4f4;
            --card-bg: white;
            --text-color: #333;
            --button-bg: #007bff;
            --button-hover: #0056b3;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        /* Dark Theme Variables */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --button-bg: #3782d8;
                --button-hover: #5396e7;
                --shadow: rgba(0, 0, 0, 0.5);
            }
        }

        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }


        h1 { color: var(--text-color); }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--button-bg);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        a:hover { background-color: var(--button-hover); }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <h1>Welcome to my website.</h1>
        <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0;">
            <!-- Relative wrapper to hold the overlapping images -->
            <div style="position: relative; max-width: 10%;">
                <img 
                    src="laptop.jpg" 
                    alt="A photo of my laptop" 
                    style="width: 100%; height: auto; border: 2px solid black; display: block;"
                >
                <img
                    src="pin.png"
                    alt="A location pin icon"
                    style="position: absolute; top: 50%; left: 50%; transform: translate(-35%, -80%); width: 30%; height: auto;"
                >
            </div>
            <p style="margin: 0; text-align: left; max-width: 300px;">
                This website is running on my old laptop.
            </p>
        </div>
        <a href="cv.pdf" target="_blank">View my CV</a>
    </div>
</body>
</html>
